<!DOCTYPE html>
<html lang="ru">
<head>

<title>Гудермес — Развитие</title>
<style>
:root{--bg:#16222e;--panel:#1f3040;--panel2:#2a4157;--text:#eef4f8;--muted:#9bb2c4;--accent:#3ec27a;--danger:#e5534b;--warn:#f0b429;color-scheme:dark;}

button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;}
#app{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;}
:root{--bg:#0f1b26;--glass:rgba(19,32,44,.84);--line:rgba(255,255,255,.09);--text:#eef4f8;--muted:#92a9bb;--accent:#46c9a0;--danger:#f0645c;--warn:#f2b632;--panel:#1a2b3b;--panel2:#26405a;color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:pan-y;font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none;padding:0;}
svg{display:block;width:100%;height:100%;}
.pos{color:var(--accent)!important;}.neg{color:var(--danger)!important;}.warn{color:var(--warn)!important;}
#app{position:fixed;inset:0;}
#stage{position:absolute;inset:0;background:#0f1b26;}
#c{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block;}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(0,0,0,.38),inset 0 0 0 1px var(--line);}
#hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:5px;pointer-events:none;}
#hud>*{pointer-events:auto;}
.bar1,.bar2{display:flex;gap:5px;}
.hc{flex:1 1 auto;min-width:0;height:46px;display:flex;align-items:center;gap:7px;padding:0 9px;border-radius:15px;position:relative;overflow:hidden;text-align:left;}
.hc>i{display:flex;width:20px;height:20px;flex:none;color:var(--warn);}
.hc .t{display:flex;flex-direction:column;min-width:0;line-height:1.18;}

.hc small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hc.pop>i{color:#7cc4f2;}.hc.day>i{color:#c7a6f2;}
#dayBar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;border-radius:0 2px 2px 0;}
.rb{flex:none;width:44px;height:46px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;gap:1px;}

button.hc:active,.rb:active,.card:active,.tab:active,#zoomBtns button:active{filter:brightness(1.35);}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:26px;border-radius:13px;background:rgba(14,24,34,.72);font-size:12px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line);}
.pill svg{width:14px;height:14px;color:var(--muted);}
.pill.neg svg,.pill.warn svg{color:inherit;}
#zoomBtns{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 92px);display:flex;flex-direction:column;gap:6px;}
#zoomBtns button{width:44px;height:44px;border-radius:14px;padding:12px;background:var(--glass);box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 1px var(--line);}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);max-width:calc(100% - 120px);background:rgba(8,14,20,.94);padding:9px 14px;border-radius:16px;font-size:13px;line-height:1.3;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;}
#toast.show{opacity:1;}
#dock{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:7px;pointer-events:none;}
#dock>*{pointer-events:auto;}
#info{padding:7px 12px;border-radius:13px;font-size:12px;line-height:1.3;color:#d3e2ee;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
#info:empty{display:none;}
#cards{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none;touch-action:pan-x;}
#cards::-webkit-scrollbar{display:none;}#cards[hidden]{display:none;}
.card{flex:0 0 auto;min-width:92px;height:82px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--glass);box-shadow:0 5px 14px rgba(0,0,0,.4),inset 0 0 0 1px var(--line);}
.card svg{width:32px;height:32px;color:var(--c);margin-bottom:2px;}
.card .nm{font-size:12.5px;font-weight:700;}.card .co{font-size:11px;color:var(--muted);}
.card.sel{background:rgba(32,98,86,.92);box-shadow:0 0 0 2px var(--accent),0 5px 14px rgba(0,0,0,.4);}
.card.locked{opacity:.5;}.card.poor .co{color:var(--danger);}
#tabs{display:flex;align-items:stretch;gap:3px;padding:5px;border-radius:22px;background:var(--glass);box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);}

@media(max-width:360px){.hc>i{display:none;}.hc{padding:0 7px;gap:0;}.hc b{font-size:14px;}.tab{font-size:10px;}}
@media(max-height:430px){#info{display:none;}.tab{height:44px;}.tab span{display:none;}}
#overlay{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
#overlay[hidden]{display:none;}
#sheet{background:var(--panel);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));touch-action:pan-y;-webkit-overflow-scrolling:touch;}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.sh-head h2{margin:0;font-size:18px;}
.x{background:var(--panel2);width:34px;height:34px;border-radius:50%;font-size:16px;}
#sheet h3{margin:14px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
#sheet table{width:100%;border-collapse:collapse;}
#sheet td{padding:4px 0;border-bottom:1px solid #2a4157;font-size:14px;}
#sheet td.r{text-align:right;font-weight:600;white-space:nowrap;}
#sheet p{margin:6px 0;line-height:1.4;} .muted{color:var(--muted);font-size:12px;}
#sheet ul,#sheet ol{margin:6px 0;padding-left:20px;line-height:1.45;} #sheet li{margin-bottom:4px;}
.bar{height:10px;background:#12202c;border-radius:6px;overflow:hidden;margin:6px 0;} .bar i{display:block;height:100%;background:var(--accent);}
.taxrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0;}
.taxrow button{width:54px;height:46px;border-radius:12px;background:var(--panel2);font-size:24px;font-weight:700;}
.taxrow b{font-size:22px;min-width:64px;text-align:center;}
.btn{display:block;width:100%;padding:13px;margin-top:8px;border-radius:12px;background:var(--panel2);font-size:15px;font-weight:600;}
.btn.green{background:#2f8f5f;} .btn.red{background:#b83d36;} .btn:active{filter:brightness(1.2);}
.btns2{display:flex;gap:8px;} .btns2 .btn{flex:1;}
#codeBox{width:100%;height:110px;background:#12202c;color:var(--text);border:1px solid #2a4157;border-radius:10px;padding:8px;font:12px/1.3 monospace;resize:none;user-select:text;-webkit-user-select:text;}
#overlay{background:rgba(4,9,14,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
#sheet{background:#172635;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5),inset 0 1px 0 var(--line);max-height:90%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out;}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#sheet{animation:none;}}
.sh-head h2{display:flex;align-items:center;gap:9px;font-size:19px;letter-spacing:-.01em;}
.sh-head h2 svg{width:22px;height:22px;color:var(--accent);flex:none;}
.x{width:38px;height:38px;padding:10px;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;border-radius:15px;}
#sheet>.btn,#sheet>.btns2{margin-top:9px;}
.btn svg{width:20px;height:20px;flex:none;}
.btn.green{background:#23846a;}.btn.red{background:#b5413a;}
.big2{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0;}
.taxrow button{width:64px;height:52px;border-radius:15px;}
</style>

<body>
<div id="app">
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="zoomBtns"><button id="zIn" aria-label="Приблизить" data-i="plus"></button><button id="zOut" aria-label="Отдалить" data-i="minus"></button><button id="zCenter" aria-label="К центру" data-i="center"></button></div>
    <div id="toast"></div>
  </main>
  <header id="hud">
    <div class="bar1">
      <button class="hc glass money" data-open="budget" aria-label="Бюджет"><i data-i="coin"></i><span class="t"><b id="hMoneyV">0 ₽</b><small id="hNet">+0 ₽/день</small></span></button>
      <button class="hc glass pop" data-open="stats" aria-label="Статистика"><i data-i="pop"></i><span class="t"><b id="hPopV">0</b><small>жителей</small></span></button>
      <div class="hc glass day"><i data-i="cal"></i><span class="t"><b id="hDay">День 1</b><small id="hCal"></small></span><i id="dayBar"></i></div>
      <button class="rb glass" id="btnSpeed" aria-label="Скорость"></button>
      <button class="rb glass" id="btnMenu" aria-label="Меню" data-i="menu"></button>
    </div>
    <div class="bar2">
      <div class="pill"><i data-i="jobs" style="display:flex;width:14px;height:14px"></i><b id="hJobsV">0/0</b></div>
      <div class="pill" id="hUn"><i data-i="unemp" style="display:flex;width:14px;height:14px"></i><b id="hUnV">0%</b></div>
      <div class="pill" id="hHap"><i data-i="mood" style="display:flex;width:14px;height:14px"></i><b id="hHapV">0%</b></div>
    </div>
  </header>
  <footer id="dock"><div id="info" class="glass"></div><div id="cards" hidden></div><nav id="tabs"></nav></footer>
</div>
<div id="overlay" hidden><div id="sheet"></div></div>

<script>
(function(){
'use strict';

/* ================= Константы и данные ================= */
const W=24, H=28;
const DAY_MS=4000, CLEAR_COST=20, REFUND=0.4, WORK_RATE=0.6, WAGE=50;
const SAVE_KEY='gudermes_razvitie_save_v1', HELP_KEY='gudermes_razvitie_help_seen';
const SPEEDS=[0,1,2,4];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const LEVELS=[
  {n:'Село',pop:0,mult:1},
  {n:'Посёлок',pop:40,mult:1.1},
  {n:'Малый город',pop:150,mult:1.25},
  {n:'Город',pop:400,mult:1.4},
  {n:'Крупный город',pop:900,mult:1.6}
];
const B={
  road:{name:'Дорога',icon:'🛣️',cost:50,upkeep:1,lvl:1,hint:'Дорога: нажмите или ведите пальцем, чтобы проложить. Двигать карту — двумя пальцами.'},
  house:{name:'Дом',icon:'🏠',cost:300,upkeep:2,cap:8,lvl:1,hint:'Дом: жильё на 8 человек. Нужна дорога рядом (сверху, снизу, слева или справа).'},
  shop:{name:'Магазин',icon:'🏪',cost:500,upkeep:5,jobs:8,serve:40,lvl:1,hint:'Магазин: 8 рабочих мест, обслуживает 40 жителей и приносит налог с торговли. Нужна дорога рядом.'},
  park:{name:'Парк',icon:'🌳',cost:200,upkeep:3,lvl:1,hint:'Парк: радует жителей (один парк на ~60 человек). Дорога не нужна.'},
  school:{name:'Школа',icon:'🏫',cost:1500,upkeep:25,jobs:14,lvl:2,hint:'Школа: 14 рабочих мест, повышает настроение (одна на ~100 жителей). Нужна дорога рядом.'},
  hospital:{name:'Больница',icon:'🏥',cost:2500,upkeep:40,jobs:20,lvl:3,hint:'Больница: 20 рабочих мест, повышает настроение (одна на ~150 жителей). Нужна дорога рядом.'},
  factory:{name:'Мастерская',icon:'🏭',cost:900,upkeep:12,jobs:24,lvl:2,hint:'Мастерская: 24 рабочих места и налог с производства, но загрязняет город. Нужна дорога рядом.'}
};
const TOOLS=['inspect','road','house','shop','park','school','hospital','factory','demolish','stats'];
const HINTS={inspect:'Осмотр: нажмите на клетку, чтобы узнать подробности. Один палец двигает карту, два — масштаб.',
  demolish:'Снос: нажмите на здание или дорогу — игра спросит подтверждение. Вернётся 40% стоимости.',
  stats:''};

/* ================= Состояние ================= */
let S=null, ST=null;
const ui={tool:'inspect',sheet:null,confirm:null,sel:null,info:''};
let dirty=true, storageOK=true, acc=0, saveTimer=null, toastTimer=null;
const cam={x:0,y:0,z:0.8}, view={w:360,h:560,dpr:1};
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');

/* ================= Утилиты ================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const fmtS=n=>(n>=0?'+':'−')+fmt(Math.abs(n));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y){let h=Math.imul(x+7,374761393)+Math.imul(y+13,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function dateStr(day){const a=day-1+8*30;const y=2026+Math.floor(a/360);return (a%30+1)+' '+MONTHS[Math.floor((a%360)/30)]+' '+y;}
function curLevel(){return S.lvlSeen;}
function levelOfPop(p){let l=1;for(let i=0;i<LEVELS.length;i++)if(p>=LEVELS[i].pop)l=i+1;return l;}
function costOf(type){return Math.round(B[type].cost*LEVELS[curLevel()-1].mult/5)*5;}
function refundOf(type){return Math.round(B[type].cost*REFUND/5)*5;}
function inGrid(x,y){return x>=0&&y>=0&&x<W&&y<H;}
function hasRoad(x,y){return(inGrid(x+1,y)&&S.grid[y][x+1].t==='road')||(inGrid(x-1,y)&&S.grid[y][x-1].t==='road')||(inGrid(x,y+1)&&S.grid[y+1][x].t==='road')||(inGrid(x,y-1)&&S.grid[y-1][x].t==='road');}
function needsRoad(type){return type!=='road'&&type!=='park';}

/* ================= Новая игра ================= */
function isWater(x,y){const cx=2.2+1.6*Math.sin(y/4.2);return Math.abs(x+0.5-cx)<1.1;}
function newGame(){
  const rng=mulberry32(20261026), grid=[];
  for(let y=0;y<H;y++){const row=[];for(let x=0;x<W;x++){const water=isWater(x,y);row.push({t:water?'water':'grass',tree:(!water&&rng()<0.1)?1:0,res:0});}grid.push(row);}
  S={day:1,money:8000,tax:10,speed:1,lvlSeen:1,grid:grid};
  for(let x=8;x<=16;x++){grid[14][x].t='road';grid[14][x].tree=0;}
  [[9,13],[11,13]].forEach(p=>{const t=grid[p[1]][p[0]];t.t='house';t.tree=0;t.res=4;});
  const sh=grid[15][13];sh.t='shop';sh.tree=0;
  S.lvlSeen=1;acc=0;ui.sel=null;
  centerOn(12,14);
}

/* ================= Расчёт экономики ================= */
function calc(){
  const c={roads:0,houses:0,housesAct:0,cap:0,pop:0,shops:0,shopsAct:0,parks:0,schools:0,schoolsAct:0,hosp:0,hospAct:0,fact:0,factAct:0,jobs:0,upkeepB:0,upkeepR:0,inactive:0};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=S.grid[y][x],k=t.t;
    if(k==='grass'||k==='water')continue;
    const b=B[k];
    if(k==='road'){c.roads++;c.upkeepR+=b.upkeep;continue;}
    c.upkeepB+=b.upkeep;
    const act=needsRoad(k)?hasRoad(x,y):true;
    t.act=act;if(!act)c.inactive++;
    if(k==='house'){c.houses++;c.pop+=t.res;if(act){c.housesAct++;c.cap+=b.cap;}}
    else if(k==='shop'){c.shops++;if(act){c.shopsAct++;c.jobs+=b.jobs;}}
    else if(k==='park'){c.parks++;}
    else if(k==='school'){c.schools++;if(act){c.schoolsAct++;c.jobs+=b.jobs;}}
    else if(k==='hospital'){c.hosp++;if(act){c.hospAct++;c.jobs+=b.jobs;}}
    else if(k==='factory'){c.fact++;if(act){c.factAct++;c.jobs+=b.jobs;}}
  }
  const pop=c.pop,lv=curLevel();
  c.workforce=Math.floor(pop*WORK_RATE);
  c.employed=Math.min(c.workforce,c.jobs);
  c.unemployed=c.workforce-c.employed;
  c.u=c.workforce>0?c.unemployed/c.workforce:0;
  const cov=(have,need)=>need<=0?1:Math.min(1,have/need);
  c.cPark=cov(c.parks,Math.max(0,(pop-20)/60));
  c.cSchool=cov(c.schoolsAct,lv>=2?pop/100:0);
  c.cHosp=cov(c.hospAct,lv>=3?pop/150:0);
  c.cShop=cov(c.shopsAct,pop/40);
  c.f={park:15*c.cPark,school:15*c.cSchool,hosp:15*c.cHosp,shop:10*c.cShop,work:15*(1-Math.min(1,c.u*1.5)),
    tax:S.tax>10?-(S.tax-10)*2.5:(10-S.tax)*0.8,poll:-Math.min(20,c.factAct*3),debt:S.money<0?-10:0};
  let h=30;for(const k in c.f)h+=c.f[k];
  c.happy=clamp(Math.round(h),0,100);
  const fill=c.jobs>0?c.employed/c.jobs:0;
  c.incTax=Math.round(c.employed*WAGE*S.tax/100);
  c.incTrade=Math.round(Math.min(pop,c.shopsAct*B.shop.serve)*S.tax*0.1);
  c.incInd=Math.round(c.factAct*50*fill*S.tax/10);
  c.income=c.incTax+c.incTrade+c.incInd;
  c.expense=c.upkeepB+c.upkeepR;
  c.net=c.income-c.expense;
  return c;
}

function nextDay(){
  const c=calc();
  S.money+=c.net;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=S.grid[y][x];if(t.t!=='house')continue;
    const cap=B.house.cap;
    if(!t.act){t.res=Math.max(0,t.res-2);continue;}
    if(c.happy<30){if(t.res>0&&Math.random()<0.25)t.res--;}
    else if(t.res<cap&&c.happy>=40&&c.u<0.35&&(c.jobs>c.employed||c.u<0.15)){
      if(Math.random()<(c.happy-30)/100*0.8)t.res=Math.min(cap,t.res+(c.happy>75?2:1));
    }
  }
  S.day++;
  const pop=calc().pop,lv=levelOfPop(pop);
  if(lv>S.lvlSeen){
    S.lvlSeen=lv;
    const un=Object.keys(B).filter(k=>B[k].lvl===lv).map(k=>B[k].name);
    toast('🎉 '+LEVELS[lv-1].n+'! '+(un.length?'Доступно: '+un.join(', ')+'.':''),4200);
  }
  if(S.money<0)toast('⚠️ Бюджет в минусе! Поднимите налоги или снесите лишнее.',3000);
  save(false);
  refreshUI();
}

/* ================= Строительство ================= */
function tryBuild(type,x,y,quiet){
  const t=S.grid[y][x],b=B[type];
  if(t.t==='water'){if(!quiet)toast('Здесь река — строить нельзя');return false;}
  if(t.t!=='grass'){if(!quiet)toast('Клетка занята');return false;}
  if(curLevel()<b.lvl){toast('🔒 '+b.name+' откроется при '+LEVELS[b.lvl-1].pop+' жителях ('+LEVELS[b.lvl-1].n+')');return false;}
  const cost=costOf(type)+(t.tree?CLEAR_COST:0);
  if(S.money<cost){toast('Не хватает средств: нужно '+fmt(cost)+' ₽');return false;}
  S.money-=cost;t.t=type;t.tree=0;t.res=0;
  toast(b.icon+' '+b.name+': −'+fmt(cost)+' ₽',900);
  scheduleSave();refreshUI();
  return true;
}
function demolish(x,y){
  const t=S.grid[y][x];
  if(t.t==='grass'||t.t==='water')return false;
  const type=t.t,val=refundOf(type);
  S.money+=val;t.t='grass';t.res=0;t.tree=0;
  toast('Снесено: '+B[type].name+' (+'+fmt(val)+' ₽)');
  scheduleSave();refreshUI();
  return true;
}

/* ================= Сохранение ================= */
function serialize(){
  return JSON.stringify({v:1,day:S.day,money:S.money,tax:S.tax,speed:S.speed,lvl:S.lvlSeen,
    grid:S.grid.map(r=>r.map(t=>[t.t,t.res,t.tree]))});
}
function parseSave(str){
  try{
    const d=JSON.parse(str);
    if(!d||d.v!==1||!Array.isArray(d.grid)||d.grid.length!==H)return null;
    const ok=['grass','water','road','house','shop','park','school','hospital','factory'];
    const grid=[];
    for(let y=0;y<H;y++){
      if(!Array.isArray(d.grid[y])||d.grid[y].length!==W)return null;
      const row=[];
      for(let x=0;x<W;x++){
        const c=d.grid[y][x];
        if(!Array.isArray(c)||ok.indexOf(c[0])<0)return null;
        row.push({t:c[0],res:c[0]==='house'?clamp(c[1]|0,0,B.house.cap):0,tree:c[0]==='grass'&&c[2]?1:0});
      }
      grid.push(row);
    }
    if(!isFinite(d.money)||!isFinite(d.day))return null;
    return {day:Math.max(1,d.day|0),money:Math.round(d.money),tax:clamp(d.tax|0,0,25),speed:SPEEDS.indexOf(d.speed)>=0?d.speed:1,lvlSeen:clamp(d.lvl|0,1,LEVELS.length),grid:grid};
  }catch(e){return null;}
}
function applyState(st){
  S=st;const c=calc();S.lvlSeen=Math.max(S.lvlSeen,levelOfPop(c.pop));
  acc=0;ui.sel=null;refreshUI();
}
function save(manual){
  try{localStorage.setItem(SAVE_KEY,serialize());if(manual)toast('💾 Игра сохранена');return true;}
  catch(e){storageOK=false;if(manual)toast('Сохранение недоступно в этом режиме. Используйте «Скопировать код».',3500);return false;}
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(false),1200);}
function loadGame(){
  let raw=null;
  try{raw=localStorage.getItem(SAVE_KEY);}catch(e){}
  if(!raw){toast('Сохранения не найдено');return false;}
  const st=parseSave(raw);
  if(!st){toast('Сохранение повреждено');return false;}
  applyState(st);toast('📂 Игра загружена');return true;
}

/* ================= Камера и проекция ================= */
const BOUNDS={minX:-28*32-40,maxX:24*32+40,minY:-60,maxY:52*16+40};
function P(u,v,z){return[(u-v)*32,(u+v)*16-(z||0)];}
function minZoom(){return clamp(Math.min(view.w/1780,view.h/950),0.12,0.5);}
function clampCam(){
  cam.z=clamp(cam.z,minZoom(),2.6);
  const wx=clamp((view.w/2-cam.x)/cam.z,BOUNDS.minX,BOUNDS.maxX),wy=clamp((view.h/2-cam.y)/cam.z,BOUNDS.minY,BOUNDS.maxY);
  cam.x=view.w/2-wx*cam.z;cam.y=view.h/2-wy*cam.z;
}
function centerOn(x,y){const p=P(x+.5,y+.5,0);cam.x=view.w/2-p[0]*cam.z;cam.y=view.h/2-p[1]*cam.z;clampCam();dirty=true;}
function zoomAt(sx,sy,f){
  const wx=(sx-cam.x)/cam.z,wy=(sy-cam.y)/cam.z;
  cam.z=clamp(cam.z*f,minZoom(),2.6);
  cam.x=sx-wx*cam.z;cam.y=sy-wy*cam.z;clampCam();dirty=true;
}
function screenToTile(sx,sy){
  const wx=(sx-cam.x)/cam.z,wy=(sy-cam.y)/cam.z,a=wx/32,b=wy/16;
  const x=Math.floor((a+b)/2),y=Math.floor((b-a)/2);
  return inGrid(x,y)?{x:x,y:y}:null;
}
function tileToScreen(x,y){const p=P(x+.5,y+.5,0);return[p[0]*cam.z+cam.x,p[1]*cam.z+cam.y];}
function resize(){
  const st=$('stage');
  view.w=st.clientWidth||360;view.h=st.clientHeight||560;
  view.dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(view.w*view.dpr);cv.height=Math.round(view.h*view.dpr);
  clampCam();dirty=true;
}

/* ================= Отрисовка ================= */
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  return 'rgb('+clamp(Math.round(((n>>16)&255)*f),0,255)+','+clamp(Math.round(((n>>8)&255)*f),0,255)+','+clamp(Math.round((n&255)*f),0,255)+')';
}
function poly(pts,fill,stroke){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function box(x0,y0,x1,y1,h,base,topCol,z0){
  z0=z0||0;
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z0+h),P(x0,y1,z0+h)],shade(base,.9));
  poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z0+h),P(x1,y0,z0+h)],shade(base,.7));
  poly([P(x0,y0,z0+h),P(x1,y0,z0+h),P(x1,y1,z0+h),P(x0,y1,z0+h)],topCol||shade(base,1.08));
}
function winL(x,y1,u0,u1,z0,z1,col){poly([P(u0,y1,z0),P(u1,y1,z0),P(u1,y1,z1),P(u0,y1,z1)],col||'#5d8fb3');}
function winR(x1,v0,v1,z0,z1,col){poly([P(x1,v0,z0),P(x1,v1,z0),P(x1,v1,z1),P(x1,v0,z1)],col||'#476f8d');}
function tree(u,v,s){
  const p=P(u,v,0);
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(p[0],p[1]+1,8*s,4*s,0,0,6.283);ctx.fill();
  ctx.fillStyle='#6b4a2f';ctx.fillRect(p[0]-1.5*s,p[1]-9*s,3*s,9*s);
  ctx.fillStyle='#2f7d3a';ctx.beginPath();ctx.arc(p[0],p[1]-15*s,9*s,0,6.283);ctx.fill();
  ctx.fillStyle='#3f9a4a';ctx.beginPath();ctx.arc(p[0]-2.5*s,p[1]-17.5*s,5.5*s,0,6.283);ctx.fill();
}
function badge(x,y,z){
  const p=P(x+.5,y+.5,z);
  ctx.fillStyle='#e5534b';ctx.beginPath();ctx.arc(p[0],p[1],9,0,6.283);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',p[0],p[1]+.5);
}
const GREENS=['#6fae4f','#68a64a','#74b554','#6aa84c'];
const WALLS=['#ecdcb8','#dcbd9f','#cddbe5','#e8cfcf'];
const ROOFS=['#b5503c','#8c4a3a','#4f6d8a','#6f7f3f'];

function drawGround(x,y,t){
  const k=t.t;let col;
  if(k==='water')col=((x+y)&1)?'#3b86c8':'#4091d4';
  else if(k==='road')col='#585f68';
  else if(k==='park')col='#7dc45c';
  else if(k==='grass')col=GREENS[((x+y)&1)*2+(hash(x,y)>.5?1:0)];
  else col='#9bb68a';
  poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],col,col);
  if(k==='water'&&hash(x,y)>.5){const p=P(x+.5,y+.5);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p[0]-8,p[1]);ctx.lineTo(p[0]+4,p[1]);ctx.stroke();}
  if(k==='road'){
    const c=P(x+.5,y+.5);
    ctx.strokeStyle='#f1d878';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();
    let any=false;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
      const nx=x+d[0],ny=y+d[1];
      if(inGrid(nx,ny)&&S.grid[ny][nx].t==='road'){const e=P(x+.5+d[0]*.5,y+.5+d[1]*.5);ctx.moveTo(c[0],c[1]);ctx.lineTo(e[0],e[1]);any=true;}
    });
    if(!any){ctx.moveTo(c[0]-5,c[1]);ctx.lineTo(c[0]+5,c[1]);}
    ctx.stroke();ctx.setLineDash([]);
  }
  if(y===H-1)poly([P(x,H),P(x+1,H),P(x+1,H,-12),P(x,H,-12)],'#6b4a2f');
  if(x===W-1)poly([P(W,y),P(W,y+1),P(W,y+1,-12),P(W,y,-12)],'#563b25');
}

function drawObject(x,y,t){
  const k=t.t;
  if(k==='grass'){if(t.tree){tree(.25+hash(x,y)*.5+x,.3+hash(y,x)*.4+y,1);}return;}
  if(k==='house'){
    const wi=Math.floor(hash(x,y)*4)%4,wall=WALLS[wi],roof=ROOFS[(wi+Math.floor(hash(y,x)*3)+1)%4];
    const x0=x+.18,x1=x+.82,y0=y+.18,y1=y+.82,h=15;
    box(x0,y0,x1,y1,h,wall);
    winL(x,y1,x0+.1,x0+.24,5,11);winL(x,y1,x0+.4,x0+.5,0,9,'#6b4a2f');winR(x1,y0+.14,y0+.3,5,11);
    const ap=P(x+.5,y+.5,h+13);
    poly([P(x0-.05,y1+.05,h),P(x1+.05,y1+.05,h),ap],shade(roof,1));
    poly([P(x1+.05,y0-.05,h),P(x1+.05,y1+.05,h),ap],shade(roof,.72));
    if(t.res>=B.house.cap){const p=P(x+.5,y+.5,h+16);ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(p[0],p[1],2.5,0,6.283);ctx.fill();}
    if(t.act===false)badge(x,y,h+26);
  }else if(k==='shop'){
    const x0=x+.1,x1=x+.9,y0=y+.15,y1=y+.85,h=13;
    box(x0,y0,x1,y1,h,'#e9dfc9');
    for(let i=0;i<6;i++){const a=x0+(x1-x0)*i/6,b=x0+(x1-x0)*(i+1)/6;poly([P(a,y1,h),P(b,y1,h),P(b,y1,h-4),P(a,y1,h-4)],i%2?'#f4f0e6':'#d6453d');}
    winL(x,y1,x0+.08,x0+.3,2,8,'#7fb2d3');winL(x,y1,x0+.5,x0+.62,0,8,'#6b4a2f');
    box(x+.38,y+.35,x+.62,y+.55,5,'#f2c14e',null,h);
    if(t.act===false)badge(x,y,h+18);
  }else if(k==='park'){
    poly([P(x+.32,y+.32),P(x+.68,y+.32),P(x+.68,y+.68),P(x+.32,y+.68)],'#dcd2a8');
    const c=P(x+.5,y+.5);ctx.fillStyle='#4da3d8';ctx.beginPath();ctx.ellipse(c[0],c[1],6,3,0,0,6.283);ctx.fill();
    tree(x+.22,y+.24,.9);tree(x+.8,y+.22,.8);tree(x+.2,y+.8,.85);tree(x+.8,y+.78,.95);
  }else if(k==='school'){
    const x0=x+.08,x1=x+.92,y0=y+.12,y1=y+.88,h=22;
    box(x0,y0,x1,y1,h,'#efd58a','#b2523f');
    for(let i=0;i<3;i++){const u=x0+.1+i*.24;winL(x,y1,u,u+.12,11,18);}
    winL(x,y1,x0+.1,x0+.22,0,8,'#6b4a2f');winL(x,y1,x0+.34,x0+.46,0,8,'#6b4a2f');
    winR(x1,y0+.12,y0+.26,11,18);winR(x1,y0+.42,y0+.56,11,18);
    box(x+.4,y+.4,x+.62,y+.62,10,'#e6c97a','#9c4636',h);
    const a=P(x+.51,y+.51,h+10),b=P(x+.51,y+.51,h+24);
    ctx.strokeStyle='#444';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    poly([[b[0],b[1]],[b[0]+10,b[1]+3],[b[0],b[1]+6]],'#e5534b');
    if(t.act===false)badge(x,y,h+32);
  }else if(k==='hospital'){
    const x0=x+.06,x1=x+.94,y0=y+.1,y1=y+.9,h=30;
    box(x0,y0,x1,y1,h,'#f2f5f7','#dfe7ee');
    poly([P(x0,y1,14),P(x1,y1,14),P(x1,y1,19),P(x0,y1,19)],'#3a7bd5');
    poly([P(x1,y0,14),P(x1,y1,14),P(x1,y1,19),P(x1,y0,19)],'#2c60aa');
    for(let i=0;i<3;i++){const u=x0+.12+i*.25;winL(x,y1,u,u+.13,21,27,'#8fb8d8');winL(x,y1,u,u+.13,4,11,'#8fb8d8');}
    winR(x1,y0+.12,y0+.26,21,27,'#6f9bbd');winR(x1,y0+.45,y0+.59,21,27,'#6f9bbd');
    const q=(a,b,c,d)=>poly([P(x+a,y+c,h+.2),P(x+b,y+c,h+.2),P(x+b,y+d,h+.2),P(x+a,y+d,h+.2)],'#d94141');
    q(.3,.7,.43,.57);q(.43,.57,.3,.7);
    if(t.act===false)badge(x,y,h+14);
  }else if(k==='factory'){
    const x0=x+.08,x1=x+.92,y0=y+.12,y1=y+.88,h=15;
    box(x0,y0,x1,y1,h,'#a0a9b1','#6f787f');
    for(let i=0;i<3;i++){const u=x0+.1+i*.25;winL(x,y1,u,u+.14,5,10,'#3d4a55');}
    winR(x1,y0+.15,y0+.35,5,10,'#3d4a55');
    box(x+.62,y+.14,x+.8,y+.32,22,'#8a5a44','#5b3a2b',h);
    const p=P(x+.71,y+.23,h+30);ctx.fillStyle='rgba(235,235,235,.6)';
    ctx.beginPath();ctx.arc(p[0],p[1],6,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(p[0]+7,p[1]-8,8,0,6.283);ctx.fill();
    if(t.act===false)badge(x,y,h+22);
  }
}

function vis(x,y,m){const sx=(x-y)*32*cam.z+cam.x,sy=(x+y+1)*16*cam.z+cam.y;return sx>-m&&sx<view.w+m&&sy>-m&&sy<view.h+m*1.2;}
function draw(){
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.fillStyle='#0f1b26';ctx.fillRect(0,0,view.w,view.h);
  ctx.setTransform(view.dpr*cam.z,0,0,view.dpr*cam.z,view.dpr*cam.x,view.dpr*cam.y);
  const m=80*cam.z,tool=ui.tool,wantRoad=B[tool]&&needsRoad(tool);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!vis(x,y,m))continue;
    const t=S.grid[y][x];
    drawGround(x,y,t);
    if(wantRoad&&t.t==='grass'&&hasRoad(x,y))poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],'rgba(255,255,255,.16)');
  }
  for(let s=0;s<W+H-1;s++){
    for(let x=Math.max(0,s-(H-1));x<=Math.min(W-1,s);x++){
      const y=s-x;if(!vis(x,y,m))continue;
      drawObject(x,y,S.grid[y][x]);
    }
  }
  if(ui.sel){
    const x=ui.sel.x,y=ui.sel.y;
    poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],'rgba(255,255,255,.12)');
    ctx.strokeStyle=ui.tool==='demolish'?'#ff6b60':'#ffffff';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(...P(x,y));ctx.lineTo(...P(x+1,y));ctx.lineTo(...P(x+1,y+1));ctx.lineTo(...P(x,y+1));ctx.closePath();ctx.stroke();
  }
}

/* ================= Ввод: касания ================= */
const ptrs=new Map();let g=null,pinch=null;
function posOf(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function pinchStart(){
  const a=Array.from(ptrs.values()),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
  pinch={d0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,z0:cam.z,wx:(mx-cam.x)/cam.z,wy:(my-cam.y)/cam.z};
}
function lineTiles(a,b){
  const out=[];let x=a.x,y=a.y;
  while(x!==b.x||y!==b.y){const dx=b.x-x,dy=b.y-y;if(Math.abs(dx)>=Math.abs(dy))x+=Math.sign(dx);else y+=Math.sign(dy);out.push({x:x,y:y});}
  return out;
}
function paintRoad(tile){
  if(!tile)return;
  if(!g.last){g.last=g.start||tile;if(g.start&&S.grid[g.start.y][g.start.x].t==='grass')tryBuild('road',g.start.x,g.start.y,true);}
  const path=lineTiles(g.last,tile);
  for(const p of path){if(S.grid[p.y][p.x].t!=='road')tryBuild('road',p.x,p.y,false);}
  g.last=tile;ui.sel=tile;
}
cv.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=posOf(e);ptrs.set(e.pointerId,{x:p.x,y:p.y,sx:p.x,sy:p.y});
  if(ptrs.size===1){g={moved:false,cancelled:false,last:null,start:screenToTile(p.x,p.y)};}
  else if(ptrs.size===2){g.cancelled=true;pinchStart();}
});
cv.addEventListener('pointermove',e=>{
  const q=ptrs.get(e.pointerId);if(!q)return;
  const p=posOf(e),dx=p.x-q.x,dy=p.y-q.y;q.x=p.x;q.y=p.y;
  if(ptrs.size===1&&g&&!g.cancelled){
    if(!g.moved&&Math.hypot(p.x-q.sx,p.y-q.sy)>8)g.moved=true;
    if(g.moved){
      if(ui.tool==='road')paintRoad(screenToTile(p.x,p.y));
      else{cam.x+=dx;cam.y+=dy;clampCam();}
      dirty=true;
    }
  }else if(ptrs.size===2&&pinch){
    const a=Array.from(ptrs.values()),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
    cam.z=clamp(pinch.z0*d/pinch.d0,minZoom(),2.6);
    cam.x=mx-pinch.wx*cam.z;cam.y=my-pinch.wy*cam.z;clampCam();dirty=true;
  }
});
function endPtr(e,isUp){
  if(!ptrs.has(e.pointerId))return;
  const single=ptrs.size===1;
  ptrs.delete(e.pointerId);
  if(single&&g&&isUp&&!g.moved&&!g.cancelled){const p=posOf(e);handleTap(p.x,p.y);}
  if(ptrs.size===0){g=null;pinch=null;}else if(g){g.cancelled=true;if(ptrs.size<2)pinch=null;}
}
cv.addEventListener('pointerup',e=>endPtr(e,true));
cv.addEventListener('pointercancel',e=>endPtr(e,false));
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();const p=posOf(e);zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15);},{passive:false});

function describe(x,y){
  const t=S.grid[y][x];
  if(t.t==='water')return '🌊 Река Сунжа. Строить нельзя.';
  if(t.t==='grass')return (t.tree?'🌲 Лес (расчистка +'+CLEAR_COST+' ₽). ':'🟩 Свободная земля. ')+'Клетка '+(x+1)+':'+(y+1)+'.';
  const b=B[t.t];let s=b.icon+' '+b.name+'. ';
  if(t.t==='road')return s+'Содержание '+b.upkeep+' ₽/день.';
  s+=(t.act?'✅ Работает. ':'⚠️ Не работает: рядом нет дороги. ');
  if(t.t==='house')s+='Жителей: '+t.res+' из '+b.cap+'. ';
  if(b.jobs)s+='Рабочих мест: '+b.jobs+'. ';
  return s+'Содержание '+b.upkeep+' ₽/день.';
}
function handleTap(sx,sy){
  const tl=screenToTile(sx,sy);if(!tl)return;
  ui.sel=tl;dirty=true;
  const tool=ui.tool;
  if(tool==='inspect'){calc();setInfo(describe(tl.x,tl.y));}
  else if(tool==='demolish'){
    const t=S.grid[tl.y][tl.x];
    if(t.t==='grass'||t.t==='water'){toast('Здесь нечего сносить');return;}
    ui.confirm={x:tl.x,y:tl.y};openSheet('confirm');
  }
  else if(B[tool]){tryBuild(tool,tl.x,tl.y,false);}
}

function buildDock(){
  const tb=$('tabs');
  tb.innerHTML=CATS.map(c=>'<button class="tab" data-cat="'+c.id+'">'+svg(c.i)+'<span>'+c.n+'</span></button>').join('')+'<i class="sep"></i><button class="tab" data-tool="inspect">'+svg('inspect')+'<span>Осмотр</span></button><button class="tab dem" data-tool="demolish">'+svg('demolish')+'<span>Снос</span></button>';
  tb.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.cat){
      ui.cat=ui.cat===b.dataset.cat?null:b.dataset.cat;
      const c=CATS.find(x=>x.id===ui.cat);
      if(c&&c.items.indexOf(ui.tool)<0)pickTool(c.items[0]);
    }else pickTool(b.dataset.tool);
    refreshDock();
  });
  $('cards').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)pickTool(b.dataset.b);});

function refreshDock(){
  const cat=CATS.find(c=>c.id===ui.cat),box=$('cards');
  document.querySelectorAll('.tab').forEach(b=>{
    const k=b.dataset.cat;
    b.classList.toggle('on',k?(ui.cat===k||(!ui.cat&&CATS.find(c=>c.id===k).items.indexOf(ui.tool)>=0)):b.dataset.tool===ui.tool);
  });
  box.hidden=!cat;
  if(!cat){box.dataset.cat='';return;}
  if(box.dataset.cat!==cat.id){
    box.dataset.cat=cat.id;
    box.innerHTML=cat.items.map(k=>'<button class="card" data-b="'+k+'" style="--c:'+COL[k]+'">'+svg(k)+'<span class="nm">'+B[k].name+'</span><span class="co"></span></button>').join('');
  }
  box.querySelectorAll('.card').forEach(el=>{
    const k=el.dataset.b,lk=curLevel()<B[k].lvl,c=costOf(k);
    el.classList.toggle('sel',k===ui.tool);el.classList.toggle('locked',lk);el.classList.toggle('poor',!lk&&S.money<c);
    el.querySelector('.co').textContent=lk?'от '+LEVELS[B[k].lvl-1].pop+' жит.':fmt(c)+' ₽';
  });

function pickTool(k){

  ui.tool=k;ui.sel=null;if(!B[k])ui.cat=null;
  setInfo(B[k]?(B[k].hint+' Цена: '+fmt(costOf(k))+' ₽, содержание '+B[k].upkeep+' ₽/день.'):HINTS[k]);

}

  el.innerHTML=(k==='stats'?statsHTML():k==='budget'?budgetHTML():k==='taxes'?taxHTML():k==='menu'?menuHTML():k==='help'?helpHTML():k==='confirm'?confirmHTML():k==='code'?codeHTML():newConfirmHTML()).replace(EMO,'');

function act(a){
  if(a==='close'){closeSheet();}
  else if(a==='taxUp'||a==='taxDown'){S.tax=clamp(S.tax+(a==='taxUp'?1:-1),0,25);scheduleSave();refreshUI();}
  else if(a==='doDemolish'){const cf=ui.confirm;closeSheet();if(cf)demolish(cf.x,cf.y);ui.sel=null;}
  else if(a==='save'){save(true);}
  else if(a==='load'){if(loadGame())closeSheet();}
  else if(a==='help'){openSheet('help');}
  else if(a==='newAsk'){openSheet('newconfirm');}
  else if(a==='newDo'){try{localStorage.removeItem(SAVE_KEY);}catch(_){}newGame();closeSheet();refreshUI();toast('Новая игра. Удачи, мэр!');}
  else if(a==='menu'||a==='stats'||a==='budget'||a==='taxes'){openSheet(a);}
  else if(a==='code'){openSheet('code');}
  else if(a==='codeCopy'){
    const cb=$('codeBox');if(!cb)return;
    cb.focus();try{cb.select();cb.setSelectionRange(0,cb.value.length);}catch(_){}
    let done=false;
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cb.value).then(()=>toast('📋 Код скопирован'),()=>toast('Выделите текст и скопируйте вручную'));done=true;}}catch(_){}
    if(!done)toast('Текст выделен — скопируйте его вручную');
  }
  else if(a==='codeLoad'){
    const cb=$('codeBox');let st=null;
    if(cb&&cb.value.trim()){try{st=parseSave(atob(cb.value.trim()));}catch(_){}}
    if(st){applyState(st);save(false);closeSheet();toast('📂 Игра загружена из кода');}else toast('Код не подошёл');
  }
}

/* ================= Главный цикл ================= */
let lastT=0,lastBar=-1;
function loop(now){
  const dt=Math.min(250,now-lastT);lastT=now;
  if(S&&S.speed>0&&!ui.sheet){
    acc+=dt*S.speed;
    while(acc>=DAY_MS){acc-=DAY_MS;nextDay();}
  }
  const bar=S&&S.speed>0?Math.round(acc/DAY_MS*100):0;
  if(bar!==lastBar){lastBar=bar;$('dayBar').style.width=bar+'%';}
  if(dirty){dirty=false;draw();}
  requestAnimationFrame(loop);
}

/* ================= Запуск ================= */
function start(){
  try{localStorage.setItem('gd_test','1');localStorage.removeItem('gd_test');}catch(e){storageOK=false;}
  buildDock();initIcons();
  cam.z=clamp(view.w/480,0.5,1.1);
  resize();
  let loaded=false;
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const st=parseSave(raw);if(st){applyState(st);loaded=true;}}}catch(e){}
  if(!loaded){newGame();}
  cam.z=clamp(view.w/480,0.5,1.1);centerOn(12,14);
  refreshUI();
  setInfo(HINTS.inspect);
  if(loaded)toast('📂 Сохранённая игра загружена');
  else{let seen=false;try{seen=localStorage.getItem(HELP_KEY);}catch(e){}if(!seen){try{localStorage.setItem(HELP_KEY,'1');}catch(e){}openSheet('help');}}
  if(!storageOK)setTimeout(()=>toast('⚠️ Автосохранение недоступно. Откройте игру в Chrome или используйте «Скопировать код».',4500),1500);
  requestAnimationFrame(t=>{lastT=t;loop(t);});
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save(false);});
window.addEventListener('pagehide',()=>{if(S)save(false);});
window.addEventListener('error',e=>{try{toast('Ошибка: '+e.message,4500);}catch(_){}});
window.GD={get S(){return S;},get ST(){return ST;},ui:ui,cam:cam,calc:calc,tryBuild:tryBuild,demolish:demolish,nextDay:nextDay,serialize:serialize,parseSave:parseSave,
  applyState:applyState,newGame:newGame,save:save,loadGame:loadGame,tileToScreen:tileToScreen,screenToTile:screenToTile,act:act,pickTool:pickTool,refreshUI:refreshUI,draw:draw,resize:resize};
start();
})();
